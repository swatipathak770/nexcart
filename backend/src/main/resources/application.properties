spring.application.name=backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]


# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nexcart}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.cache.type=redis
spring.cache.redis.time-to-live=PT10M
spring.cache.redis.cache-null-values=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}


# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}
# ==========================
# JWT Configuration
# ==========================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
spring.jpa.open-in-view=false
logging.level.org.springframework.security=INFO
logging.pattern.level=%5p [requestId:%X{requestId}]
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.mode=${RAZORPAY_MODE:TEST}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
recovery.max-attempts=${RECOVERY_MAX_ATTEMPTS:3}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
