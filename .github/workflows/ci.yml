name: NexCart CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test and verify backend
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-at-least-thirty-two-characters-long
          RAZORPAY_KEY_ID: rzp_test_ci_key
          RAZORPAY_KEY_SECRET: ci-only-razorpay-secret
        run: ./mvnw -B -Pcoverage verify

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build backend container image
        run: docker build -t nexcart-backend:ci ./backend

      - name: Build frontend container image
        run: docker build --build-arg VITE_API_BASE_URL=/ -t nexcart-frontend:ci ./frontend
